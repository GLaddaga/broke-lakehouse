# One target per environment, named after it, and no `target:` default: which
# lakehouse a run builds into is chosen on the command line (`--target prod`).
# No credentials here — the plugin creates them as DuckDB secrets, from Infisical. @docs/transformation.md
lakehouse:
  outputs:
    prod:
      type: duckdb
      database: lake # LAKE in broke_lakehouse/client.py; this and the attach below change with it
      schema: main # for models with no layer
      threads: 1
      plugins:
        - module: broke_lakehouse.dbt_plugin
          config:
            environment: prod
      # The attach itself, through the `lake` secret the plugin created: the
      # path names a secret, not a catalog, so it carries no credential.
      attach:
        - path: "ducklake:lake"
          alias: lake
