# Only makes `utils` importable from anywhere — the dbt plugin, Prefect flows,
# any working directory — through the `-e .` in requirements.txt. Dependencies
# stay in requirements.txt, not here.
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "the-broke-lakehouse"
version = "0"

[tool.setuptools]
packages = ["utils"]
